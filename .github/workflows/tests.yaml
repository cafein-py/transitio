name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pip install black flake8 flake8-bugbear
      - run: black --check python/transitio scripts tests
      - run: flake8 python/transitio scripts tests
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-${{ hashFiles('scripts/fetch_test_data.py') }}
      # The reference places read the newest published index snapshot: one
      # job installs it, with the place files it reads on demand, and keeps
      # it under the snapshot's id.
      - id: restore-reference
        uses: actions/cache/restore@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          path: tests/cache/reference-index
          key: reference-index-
          restore-keys: reference-index-
      - run: python scripts/fetch_test_data.py
      - run: cargo test --workspace
      - run: pip install pytest pytest-cov
      - run: pip install -e ".[snap]"
      - run: pytest --cov=transitio --cov-report=term-missing
        env:
          TRANSITIO_REQUIRE_TEST_DATA: "1"
          TRANSITIO_REFERENCE_PLACES: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && '1' || '' }}
      - id: reference-snapshot
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: echo "snapshot=$(ls tests/cache/reference-index/snapshots | grep -E '^[0-9a-f]{16}$' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: >-
          steps.reference-snapshot.outputs.snapshot != '' &&
          steps.restore-reference.outputs.cache-matched-key != format('reference-index-{0}', steps.reference-snapshot.outputs.snapshot)
        with:
          path: tests/cache/reference-index
          key: reference-index-${{ steps.reference-snapshot.outputs.snapshot }}

