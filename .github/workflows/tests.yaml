name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pip install black flake8 flake8-bugbear
      - run: black --check python/transitio scripts tests
      - run: flake8 python/transitio scripts tests
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-${{ hashFiles('scripts/fetch_test_data.py') }}
      - run: python scripts/fetch_test_data.py
      - run: cargo test --workspace
      - run: pip install pytest pytest-cov
      - run: pip install -e ".[snap,build]"
      - run: pytest --cov=transitio --cov-report=term-missing
        env:
          TRANSITIO_REQUIRE_TEST_DATA: "1"

  registry:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the place registry with the base branch
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$base^{commit}"
          if git cat-file -e "$base:overrides/places_registry.jsonl" 2>/dev/null; then
            git show "$base:overrides/places_registry.jsonl" > /tmp/base_registry.jsonl
            echo "base registry from $base"
          else
            rm -f /tmp/base_registry.jsonl
            echo "no registry on the base commit: comparing against the header-only registry"
          fi
          python scripts/check_registry_history.py /tmp/base_registry.jsonl overrides/places_registry.jsonl
