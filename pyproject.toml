[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "transitio"
description = "AOI-driven OSM and GTFS acquisition, validation and repair — companion to pyrosm and cafein"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Henrikki Tenkanen" }]
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "httpx>=0.27",
    "pandas>=2.0",
    "platformdirs>=3",
    # pyarrow backs the Parquet feed index; geopandas does not pull it in, and
    # the index is a headline feature that must work straight after install.
    "pyarrow>=14",
    "pyrosm>=0.12.0",
    # scipy backs the shape-inference mode graphs (csgraph shortest
    # paths, cKDTree stop snapping).
    "scipy>=1.10",
    "shapely>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]

[project.optional-dependencies]
snap = ["networkx>=3"]
# Maintainer-only: the index build pipeline under scripts/ reads override YAML.
build = ["pyyaml>=6"]

[project.scripts]
transitio = "transitio._cli:main"

[project.urls]
Homepage = "https://github.com/cafein-py/transitio"
Documentation = "https://transitio.readthedocs.io"
Repository = "https://github.com/cafein-py/transitio"
Changelog = "https://github.com/cafein-py/transitio/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/transitio-py/Cargo.toml"
python-source = "python"
module-name = "transitio._core"
# LICENSE and NOTICE ship in both the sdist and the wheel; the index files
# are bundled when a build populates them (see transitio.index).
include = [
    "python/transitio/index/*.parquet",
    "python/transitio/index/snapshot.json",
    "python/transitio/index/NOTICE",
]

[tool.black]
include = '(python/transitio|scripts|tests)/.*\.py$'

[tool.pytest.ini_options]
testpaths = ["tests"]
